<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Speed fiddle</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.all.min.js"></script>
    <script src="./app.js" defer></script>
    <meta property="og:title" content="Speed Fiddle - Pixelation AI">
    <meta property="og:description" content="A web-based tool for pixelating images using custom AI models.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://osuplace.github.io/pixelate-web/">
    <meta property="og:image" content="https://osuplace.github.io/pixelate-web/embedicon.png">
</head>
<body>
<div id="canvas-container">
    <canvas id="main-canvas"></canvas>
</div>
<div id="controls-container">
    <div class="control-group">
        <label for="model-dropdown">Select model:</label>
        <select id="model-dropdown">
            <option selected="selected" disabled="disabled" hidden="hidden">Select a model</option>
            <option disabled="disabled">Hover for more info</option>
            <option value="1x_pixelate4x-v5-340k_G.onnx"
                    data-saveas="phoebe"
                    title="Preserves original palette - Version 5 at 340k iter">
                🖼️🐌 Phoebe
            </option>
            <option value="1x_pixelate4x-v6-180k_G.onnx"
                    data-saveas="maia"
                    title="Restricts palette - Version 6 at 180k iter">
                🎨🐌 Maia
            </option>
            <option value="1x_pixelate4x-nf24nb6-sandra-478k_G.onnx"
                    data-saveas="sandra"
                    title="Adds outlines while preserving original palette - Version 1 at 478k iter - Tiny model - Good for CPU (and Firefox users), very fast on GPU">
                🖼️🔥 Sandra
            </option>
            <option value="1x_pixelate4x-nf24nb6v1-205k_G.onnx"
                    data-saveas="pyxis"
                    title="Restricts palette but has trouble with skin tones - Version 1 at 205k iter - Tiny model - Good for CPU (and Firefox users), very fast on GPU">
                🎨🔥 Pyxis
            </option>
        </select>
    </div>
    <div class="control-group">
        <label for="scale-range">Output width:</label>
        <input type="range" id="scale-range" min="0" max="100" value="50">
        <label for="scale-number" class="hidden">Output width (direct input):</label>
        <input type="number" id="scale-number" min="0" max="100" value="50">
    </div>
    <div class="control-group">
        <button id="run-button" disabled="disabled">✨ Pixelate ✨</button>
        <button id="download-1-button" disabled="disabled">💾 Download 1:1</button>
        <button id="download-4-button" disabled="disabled">💾 Download 4x</button>
        <button id="download-d-button" disabled="disabled" class="danger">❌ Discard</button>
    </div>
    <br>
    <div class="control-group" id="disclaimer">
        <p>Feedback is always appreciated. ❤️</p>
    </div>
</div>
<div id="text-overlay">
    <p>To begin - Select a model from bottom left dropdown</p>
    <p>or</p>
    <p>Upload SR model in .onnx format</p>
</div>
<input type="file" id="file-input" accept="image/*" class="hidden"/>
</body>
</html>
